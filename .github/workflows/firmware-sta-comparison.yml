name: Firmware STA comparison

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'issue-2-firmware-sta-compare'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run unit tests first
        run: python -m unittest discover -s tests -q

      - name: Install read-only SquashFS parser and AArch64 binutils
        shell: bash
        run: |
          python -m pip install -r requirements-analysis.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu

      - name: Download official JP firmware releases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/downloads
          curl -fL --retry 3 --retry-all-errors -o artifacts/downloads/1.0.2.zip 'https://static.tp-link.com/upload/firmware/2025/202508/20250822/Archer%20BE5000%28JP%29_V1_250603.zip'
          curl -fL --retry 3 --retry-all-errors -o artifacts/downloads/1.0.3.zip 'https://static.tp-link.com/upload/firmware/2025/202510/20251017/Archer%20BE5000_V1_250825.zip'
          curl -fL --retry 3 --retry-all-errors -o artifacts/downloads/1.1.0.zip 'https://static.tp-link.com/upload/firmware/2026/202602/20260202/Archer%20BE5000_V1_260108.zip'
          curl -fL --retry 3 --retry-all-errors -o artifacts/downloads/1.2.0.zip 'https://static.tp-link.com/upload/firmware/2026/202606/20260612/Archer%20BE5000_V1_260420.zip'
          sha256sum artifacts/downloads/*.zip

      - name: Download GPL source and select firmware verification key source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-all-errors -o artifacts/GPL_ArcherBE5000.tar.gz 'https://static.tp-link.com/upload/gpl-code/2026/202605/20260512/GPL_ArcherBE5000.tar.gz'
          python -m tools.inspect_gpl artifacts/GPL_ArcherBE5000.tar.gz \
            --output artifacts/gpl-selected \
            --select '/nvrammanager/nm_fwup\.c$'
          nm_count="$(find artifacts/gpl-selected -maxdepth 1 -type f -name '*.txt' | wc -l)"
          test "$nm_count" -eq 1

      - name: Verify, decode and reconstruct rootfs volumes
        shell: bash
        run: |
          set -euo pipefail
          NM_SOURCE="$(find artifacts/gpl-selected -maxdepth 1 -type f -name '*.txt' -print -quit)"
          : > artifacts/rootfs-list.txt
          for version in 1.0.2 1.0.3 1.1.0 1.2.0; do
            python -m tools.decode_cloud "artifacts/downloads/$version.zip" \
              --nm-source "$NM_SOURCE" \
              --output "artifacts/decoded-$version.bin" \
              --report "artifacts/decoded-$version.json"
            ubi_start="$(python -c "import json; r=json.load(open('artifacts/decoded-$version.json')); h=[x['offset'] for x in r['magic_candidates'] if x['kind']=='ubi']; assert h; print(hex(min(h)))")"
            python -m tools.read_ubi "artifacts/decoded-$version.bin" \
              --start "$ubi_start" --peb-size 0x20000 \
              --output "artifacts/volumes-$version"
            rootfs="$(python -c "from pathlib import Path; ps=sorted(Path('artifacts/volumes-$version').glob('volume-*.bin')); m=[p for p in ps if p.open('rb').read(4)==b'hsqs']; assert len(m)==1, len(m); print(m[0])")"
            printf '%s=%s\n' "$version" "$rootfs" >> artifacts/rootfs-list.txt
          done

      - name: Compare STA/APCLI files across releases
        shell: bash
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r entry; do
            args+=(--rootfs "$entry")
          done < artifacts/rootfs-list.txt
          python -m tools.compare_firmware_versions "${args[@]}" \
            --output artifacts/firmware-version-comparison.json
          cat artifacts/firmware-version-comparison.json

      - name: Extract focused configuration and STA-related string diffs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/focused
          while IFS='=' read -r version rootfs; do
            out="artifacts/focused/$version"
            mkdir -p "$out"
            python -c "from dissect.squashfs import SquashFS; from pathlib import Path; import sys; src=open(sys.argv[1],'rb'); fs=SquashFS(src); out=Path(sys.argv[2]); items={'wifix_profile.ini':'/lib/wifi/wifix_profile.ini','meshd_cfg.json':'/etc/meshd_cfg.json','meshd_cfg_be260v1_jp.json':'/etc/meshd_cfg_be260v1_jp.json','wifix':'/usr/bin/wifix','meshd':'/usr/bin/meshd'}; [(out/name).write_bytes(fs.get(path).open().read()) for name,path in items.items()]" "$rootfs" "$out"
            strings -a "$out/wifix" | grep -Ei 'apcli|wpa_cli|wpa_supplicant|reconnect|disconnect|macrepeater|tp_mesh|rootap|bsta|wds' | sort -u > "$out/wifix-sta-strings.txt" || true
            strings -a "$out/meshd" | grep -Ei 'apcli|wpa_cli|wpa_supplicant|reconnect|disconnect|macrepeater|tp_mesh|rootap|bsta|wds' | sort -u > "$out/meshd-sta-strings.txt" || true
          done < artifacts/rootfs-list.txt
          {
            diff -u artifacts/focused/1.0.2/wifix_profile.ini artifacts/focused/1.0.3/wifix_profile.ini || true
            diff -u artifacts/focused/1.0.3/wifix_profile.ini artifacts/focused/1.1.0/wifix_profile.ini || true
            diff -u artifacts/focused/1.1.0/wifix_profile.ini artifacts/focused/1.2.0/wifix_profile.ini || true
          } > artifacts/focused/wifix-profile.diff
          {
            diff -u artifacts/focused/1.0.2/meshd_cfg.json artifacts/focused/1.0.3/meshd_cfg.json || true
            diff -u artifacts/focused/1.0.3/meshd_cfg.json artifacts/focused/1.1.0/meshd_cfg.json || true
            diff -u artifacts/focused/1.1.0/meshd_cfg.json artifacts/focused/1.2.0/meshd_cfg.json || true
          } > artifacts/focused/meshd-cfg.diff
          for bin in wifix meshd; do
            {
              for pair in '1.0.2 1.0.3' '1.0.3 1.1.0' '1.1.0 1.2.0'; do
                set -- $pair
                echo "=== $1 -> $2 ==="
                diff -u "artifacts/focused/$1/$bin-sta-strings.txt" "artifacts/focused/$2/$bin-sta-strings.txt" || true
              done
            } > "artifacts/focused/$bin-sta-strings.diff"
          done

      - name: Extract function-level STA control-flow reports
        shell: bash
        run: |
          set -euo pipefail
          targets_wifix='init_vap wpa_supplicant_setup_vif wpa_supplicant_enable_vif config_wds_setting mtk_update_vap reload_radio'
          targets_meshd='mtk_connect meshd_bmap_reconnect_sta mtk_reconfigSTA'
          for version in 1.0.2 1.0.3 1.1.0 1.2.0; do
            dir="artifacts/focused/$version"
            for bin in wifix meshd; do
              aarch64-linux-gnu-readelf -h "$dir/$bin" > "$dir/$bin-elf-header.txt"
              aarch64-linux-gnu-readelf -Ws "$dir/$bin" > "$dir/$bin-symbols-all.txt"
              grep -Ei 'init_vap|supplicant|config_wds|mtk_update_vap|reload_radio|mtk_connect|bmap_reconnect|reconfigSTA|reconnect|disconnect' "$dir/$bin-symbols-all.txt" > "$dir/$bin-symbols-sta.txt" || true
              : > "$dir/$bin-target-functions.txt"
              if [ "$bin" = wifix ]; then targets="$targets_wifix"; else targets="$targets_meshd"; fi
              for name in $targets; do
                echo "===== $name =====" >> "$dir/$bin-target-functions.txt"
                if grep -Eq "[[:space:]]$name$" "$dir/$bin-symbols-all.txt"; then
                  aarch64-linux-gnu-objdump -d --no-show-raw-insn --disassemble="$name" "$dir/$bin" >> "$dir/$bin-target-functions.txt"
                else
                  echo "SYMBOL_NOT_PRESENT" >> "$dir/$bin-target-functions.txt"
                fi
              done
            done
          done
          for bin in wifix meshd; do
            for pair in '1.0.2 1.0.3' '1.0.3 1.1.0' '1.1.0 1.2.0'; do
              set -- $pair
              diff -u "artifacts/focused/$1/$bin-target-functions.txt" "artifacts/focused/$2/$bin-target-functions.txt" > "artifacts/focused/$bin-functions-$1-to-$2.diff" || true
            done
          done

      - name: Export stripped-binary disassembly for string-xref analysis
        shell: bash
        run: |
          set -euo pipefail
          for version in 1.0.2 1.0.3 1.1.0 1.2.0; do
            dir="artifacts/focused/$version"
            for bin in wifix meshd; do
              aarch64-linux-gnu-readelf -lW "$dir/$bin" > "$dir/$bin-program-headers.txt"
              aarch64-linux-gnu-readelf -SW "$dir/$bin" > "$dir/$bin-section-headers.txt"
              aarch64-linux-gnu-objdump -d --no-show-raw-insn "$dir/$bin" > "$dir/$bin-disassembly.txt"
              strings -a -t x "$dir/$bin" > "$dir/$bin-strings-offsets.txt"
            done
          done

      - name: Upload comparison reports only
        uses: actions/upload-artifact@v4
        with:
          name: firmware-sta-comparison
          path: |
            artifacts/firmware-version-comparison.json
            artifacts/decoded-*.json
            artifacts/volumes-*/summary.json
            artifacts/focused/*.diff
            artifacts/focused/*/*-sta-strings.txt
            artifacts/focused/*/*-elf-header.txt
            artifacts/focused/*/*-symbols-sta.txt
            artifacts/focused/*/*-target-functions.txt
            artifacts/focused/*/*-program-headers.txt
            artifacts/focused/*/*-section-headers.txt
            artifacts/focused/*/*-disassembly.txt
            artifacts/focused/*/*-strings-offsets.txt
            artifacts/focused/*-functions-*.diff
          if-no-files-found: error
