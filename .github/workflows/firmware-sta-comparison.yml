name: Firmware STA comparison

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'issue-2-firmware-sta-compare'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run unit tests first
        run: python -m unittest discover -s tests -q

      - name: Install read-only SquashFS parser
        run: python -m pip install -r requirements-analysis.txt

      - name: Download official JP firmware releases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/downloads
          curl -fL --retry 3 --retry-all-errors -o artifacts/downloads/1.0.2.zip 'https://static.tp-link.com/upload/firmware/2025/202508/20250822/Archer%20BE5000%28JP%29_V1_250603.zip'
          curl -fL --retry 3 --retry-all-errors -o artifacts/downloads/1.0.3.zip 'https://static.tp-link.com/upload/firmware/2025/202510/20251017/Archer%20BE5000_V1_250825.zip'
          curl -fL --retry 3 --retry-all-errors -o artifacts/downloads/1.1.0.zip 'https://static.tp-link.com/upload/firmware/2026/202602/20260202/Archer%20BE5000_V1_260108.zip'
          curl -fL --retry 3 --retry-all-errors -o artifacts/downloads/1.2.0.zip 'https://static.tp-link.com/upload/firmware/2026/202606/20260612/Archer%20BE5000_V1_260420.zip'
          sha256sum artifacts/downloads/*.zip

      - name: Download GPL source and select firmware verification key source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-all-errors -o artifacts/GPL_ArcherBE5000.tar.gz 'https://static.tp-link.com/upload/gpl-code/2026/202605/20260512/GPL_ArcherBE5000.tar.gz'
          python -m tools.inspect_gpl artifacts/GPL_ArcherBE5000.tar.gz \
            --output artifacts/gpl-selected \
            --select '/nvrammanager/nm_fwup\.c$'
          nm_count="$(find artifacts/gpl-selected -maxdepth 1 -type f -name '*.txt' | wc -l)"
          test "$nm_count" -eq 1

      - name: Verify, decode and reconstruct rootfs volumes
        shell: bash
        run: |
          set -euo pipefail
          NM_SOURCE="$(find artifacts/gpl-selected -maxdepth 1 -type f -name '*.txt' -print -quit)"
          : > artifacts/rootfs-list.txt
          for version in 1.0.2 1.0.3 1.1.0 1.2.0; do
            python -m tools.decode_cloud "artifacts/downloads/$version.zip" \
              --nm-source "$NM_SOURCE" \
              --output "artifacts/decoded-$version.bin" \
              --report "artifacts/decoded-$version.json"
            ubi_start="$(python - "$version" <<'PY'
import json, sys
version = sys.argv[1]
report = json.load(open(f'artifacts/decoded-{version}.json', encoding='utf-8'))
hits = [x['offset'] for x in report['magic_candidates'] if x['kind'] == 'ubi']
if not hits:
    raise SystemExit('no UBI candidate')
print(hex(min(hits)))
PY
)"
            python -m tools.read_ubi "artifacts/decoded-$version.bin" \
              --start "$ubi_start" --peb-size 0x20000 \
              --output "artifacts/volumes-$version"
            rootfs="$(python - "$version" <<'PY'
from pathlib import Path
import sys
version = sys.argv[1]
matches = []
for path in sorted(Path(f'artifacts/volumes-{version}').glob('volume-*.bin')):
    with path.open('rb') as stream:
        if stream.read(4) == b'hsqs':
            matches.append(path)
if len(matches) != 1:
    raise SystemExit(f'expected one SquashFS rootfs, got {len(matches)}')
print(matches[0])
PY
)"
            printf '%s=%s\n' "$version" "$rootfs" >> artifacts/rootfs-list.txt
          done

      - name: Compare STA/APCLI files across releases
        shell: bash
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r entry; do
            args+=(--rootfs "$entry")
          done < artifacts/rootfs-list.txt
          python -m tools.compare_firmware_versions "${args[@]}" \
            --output artifacts/firmware-version-comparison.json
          cat artifacts/firmware-version-comparison.json

      - name: Upload comparison reports only
        uses: actions/upload-artifact@v4
        with:
          name: firmware-sta-comparison
          path: |
            artifacts/firmware-version-comparison.json
            artifacts/decoded-*.json
            artifacts/volumes-*/summary.json
          if-no-files-found: error
